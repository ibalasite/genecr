<!--
  mermaid-lightbox.html — 可用的 mermaid lightbox 範本（CSS + JS）

  使用方式：把整段 <style> 和 <script> 區塊**原樣**貼進 docs.html。
  搭配 `<div class="diagram-container"><div class="mermaid">...</div></div>` 結構。

  關鍵設計（曾經踩過的雷）：
  - 不要 clone 整個 .diagram-container，否則內含已渲染 SVG，再叫 mermaid.run 會破圖
  - 要 clone 已渲染好的 <svg>，剝掉 max-width/width/height 讓 transform: scale 起作用
  - 進 lightbox 時用 viewBox 算 fit-to-screen 初始縮放並置中
-->

<style>
/* ── Lightbox container ── */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;align-items:center;justify-content:center;padding:1rem}
.lightbox.active{display:flex}
.lightbox__close{position:absolute;top:1rem;right:1rem;font-size:2rem;color:#fff;cursor:pointer;line-height:1;z-index:1010;background:transparent;border:none}
.lightbox__zoom-content{width:95vw;height:90vh;overflow:hidden;background:#fff;border-radius:8px;cursor:grab;position:relative}
.lightbox__zoom-content.dragging{cursor:grabbing}
.lightbox__zoom-content > *{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none}
.lightbox__hint{position:absolute;top:1rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:.5rem 1rem;border-radius:4px;font-size:.85rem;z-index:1010;pointer-events:none}
.lightbox__controls{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);display:flex;gap:.5rem;z-index:1010}
.lightbox__controls button{background:rgba(0,0,0,.7);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:4px;width:2.5rem;height:2.5rem;font-size:1.25rem;cursor:pointer}

/* ── Diagram container (clickable, hover hint) ── */
.diagram-container{background:#fff;border:1px solid #2a2a3a;border-radius:8px;padding:1rem;margin:1rem 0;text-align:center;cursor:zoom-in;transition:border-color .2s,box-shadow .2s;overflow-x:auto}
.diagram-container:hover{border-color:#fde047;box-shadow:0 2px 12px rgba(253,224,71,.2)}
.diagram-container .mermaid{background:transparent}
</style>

<!-- Lightbox markup — paste once before </body> -->
<div class="lightbox" id="lightbox">
  <button class="lightbox__close" onclick="lbClose()">&#x2715;</button>
  <div class="lightbox__hint">滾輪縮放 · 拖曳 · +/− · 0 重置 · ESC 關閉</div>
  <div class="lightbox__zoom-content" id="lbContent"></div>
  <div class="lightbox__controls">
    <button onclick="lbZoom(1.2)">+</button>
    <button onclick="lbZoom(.83)">−</button>
    <button onclick="lbReset()">⤺</button>
  </div>
</div>

<script>
/* ── Mermaid lightbox — fit-to-screen + pan/zoom (works with rendered SVG) ── */
let lbScale = 1, lbTx = 0, lbTy = 0;
const lbContent = document.getElementById('lbContent');
function lbApply() { const c = lbContent.firstElementChild; if (c) c.style.transform = `translate(${lbTx}px,${lbTy}px) scale(${lbScale})`; }
function lbReset() { lbScale = 1; lbTx = 0; lbTy = 0; lbApply(); }
function lbZoom(f) { lbScale = Math.max(.05, Math.min(40, lbScale * f)); lbApply(); }
function lbClose() { document.getElementById('lightbox').classList.remove('active'); lbContent.innerHTML = ''; lbReset(); }

document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') lbClose(); });

lbContent.addEventListener('wheel', e => { e.preventDefault(); lbZoom(e.deltaY < 0 ? 1.15 : 1/1.15); }, { passive: false });
let _drg = false, _lx = 0, _ly = 0;
lbContent.addEventListener('mousedown', e => { _drg = true; lbContent.classList.add('dragging'); _lx = e.clientX; _ly = e.clientY; e.preventDefault(); });
window.addEventListener('mousemove', e => { if (!_drg) return; lbTx += e.clientX - _lx; lbTy += e.clientY - _ly; _lx = e.clientX; _ly = e.clientY; lbApply(); });
window.addEventListener('mouseup', () => { _drg = false; lbContent.classList.remove('dragging'); });
window.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === '+' || e.key === '=') lbZoom(1.2);
  else if (e.key === '-' || e.key === '_') lbZoom(1/1.2);
  else if (e.key === '0') lbReset();
  else if (e.key === 'Escape') lbClose();
});

// Click-to-open: clone the already-rendered SVG (NOT the container).
// Re-rendering with mermaid.run is wrong — at this point the .mermaid element
// already contains <svg>, not source code, so calling mermaid.run breaks.
document.addEventListener('click', e => {
  const dc = e.target.closest('.diagram-container');
  if (!dc) return;
  const svg = dc.querySelector('svg');
  if (!svg) return;  // not rendered yet
  const cloned = svg.cloneNode(true);
  // Strip width/height so transform: scale works from 0,0 origin
  cloned.style.maxWidth = 'none';
  cloned.style.width = 'auto';
  cloned.style.height = 'auto';
  cloned.removeAttribute('width');
  cloned.removeAttribute('height');
  lbContent.innerHTML = '';
  lbContent.appendChild(cloned);
  // Fit-to-screen on open
  requestAnimationFrame(() => {
    const rect = lbContent.getBoundingClientRect();
    const vb = cloned.viewBox && cloned.viewBox.baseVal;
    const w  = vb && vb.width  ? vb.width  : 800;
    const h  = vb && vb.height ? vb.height : 600;
    const fit = Math.min(rect.width / w, rect.height / h) * 0.9;
    lbScale = fit > 0 ? fit : 1;
    lbTx = (rect.width  - w * lbScale) / 2;
    lbTy = (rect.height - h * lbScale) / 2;
    cloned.style.width  = w + 'px';
    cloned.style.height = h + 'px';
    lbApply();
  });
  document.getElementById('lightbox').classList.add('active');
});
</script>
